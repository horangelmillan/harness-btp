<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPA5 journey CRUD (CAP local)</title>
  <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.24.1.css">
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
    data-sap-ui-compat-version="edge"
    data-sap-ui-resource-roots='{"qunit.books": "../../"}'></script>
  <script src="https://code.jquery.com/qunit/qunit-2.24.1.js"></script>
  <script>
    QUnit.config.autostart = false;
    sap.ui.getCore().attachInit(function () {
      sap.ui.require(["qunit/books/test/integration/Journey"], function () {
        QUnit.start();
      });
    });
    QUnit.done(function (d) {
      document.title = "QUNIT opa: " + d.passed + " passed, " + d.failed + " failed";
    });
  </script>
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>
  <div id="opa-fixture"></div>
</body>
</html>
