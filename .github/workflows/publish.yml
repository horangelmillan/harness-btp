# Auto-publica create-harness-btp en npm cuando se pushea un tag v*.
# Requiere: trusted publisher configurado en npmjs.com (package settings →
# Trusted Publisher → GitHub Actions: horangelmillan / harness-btp /
# publish.yml, permitir "npm publish"). Sin tokens ni secretos en el repo.
# Nota npm: la config caduca si no completa su primer publish en 2 días;
# créala justo antes de taggear la próxima versión.
name: Publish to npm
on:
  push:
    tags:
      - "v*"
permissions:
  id-token: write # OIDC para npm, sin tokens
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Empaquetado en seco (archivos incluidos)
        run: |
          echo "::group::1/4 Empaquetado en seco (npm pack --dry-run)"
          npm pack --dry-run 2>&1 | tail -n 25
          echo "::endgroup::"
      - name: Guardia de distribución (sin fugas npm)
        run: |
          echo "::group::2/4 Guardia de distribución (check-package)"
          node scripts/check-package.js
          echo "::endgroup::"
      - name: Validar meta (render --check + triple versión)
        run: |
          echo "::group::3/4 Validar meta (render --check + triple versión)"
          node scripts/validate-meta.js
          echo "::endgroup::"
      - name: Publicar en npm (OIDC, sin tokens)
        run: |
          echo "::group::4/4 Publicar en npm"
          echo "Publicando create-harness-btp v$(node -p "require('./package.json').version") (OIDC, sin tokens)"
          npm publish --access public
          echo "::endgroup::"
