# Valida el Meta-Harness en PRs y pushes a main (sin publicar).
# Superset local: node scripts/validate-meta.js (render --check + triple versión).
name: Validate meta
"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/validate-meta.js
