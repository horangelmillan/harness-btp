# Valida el Meta-Harness en PRs y pushes a main (sin publicar).
# Superset local: node scripts/validate-meta.js (render --check + triple versión).
name: Validate meta
"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validar meta (54 checks)
        run: node scripts/validate-meta.js
